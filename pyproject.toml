[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
version = "0.1.0"
description = "A股行情分析、因子选股与回测工作台（不含自动交易、加密货币与同花顺接入）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ashare-quant contributors" }]
keywords = ["a-share", "quant", "factor", "backtest", "stock-screener"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
aq = "ashare_quant.cli:main"

[project.urls]
Homepage = "https://github.com/Gray2006/ashare-quant"
Issues = "https://github.com/Gray2006/ashare-quant/issues"

[tool.setuptools.packages.find]
include = ["ashare_quant*"]

[tool.setuptools.package-data]
ashare_quant = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ashare_quant"]
omit = ["ashare_quant/web/*", "tests/*"]
